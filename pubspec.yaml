# Identify the StockWise application package.
name: stock_wise
description: "A Flutter application for StockWise project"
# Keep this app private on pub.dev.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Set the application version and build number.
version: 1.0.0+1

# Declare the supported Dart SDK range.
environment:
  sdk: ^3.12.1

# List the packages used by the running app.
dependencies:
  # Configure Flutter icons and bundled app assets.
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  crypto: ^3.0.8
  firebase_storage: ^13.5.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  mobile_scanner: ^7.4.1
  cloud_functions: ^6.4.0
  flutter_file_dialog: ^3.3.2
  mime: ^2.1.0
  open_filex: ^4.7.0
  firebase_messaging: ^16.7.1
  flutter_local_notifications: ^22.3.3
  sqflite: 2.4.5
  pdf: ^3.11.3
  archive: ^4.3.0

# List tools used for tests, linting, and app icons.
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.5


flutter:

  uses-material-design: true

# Bundle branding, postcode data, licences, and report fonts.
  assets:
    - assets/branding/app_icon.png
    - assets/branding/auth_logo.png
    - assets/data/malaysia_postcodes.json
    - assets/data/malaysia_postcodes_LICENSE.txt
    - assets/data/libphonenumber_LICENSE.txt
    - assets/fonts/StockWiseNotoSansSC-Regular.ttf
    - assets/fonts/StockWiseNotoSansSC-BoldLatin.ttf
    - assets/fonts/NotoSansSC-OFL.txt
